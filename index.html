<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Assetboard · 我的数字资产</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2335644e'/%3E%3Ctext x='10' y='29' fill='white' font-size='30' font-family='-apple-system,Helvetica,sans-serif'%3Ea%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <header id="topbar" class="appbar"><div id="agenda" class="agenda" hidden aria-label="接下来的到期与扣款"></div><div class="toolbar"><div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索" aria-label="搜索资产"><kbd>⌘ K</kbd></label><button class="button icon-only" id="import-button" data-action="import-hub" aria-label="导入" title="导入"></button><button class="button icon-only" id="inbox-button" data-action="inbox" aria-label="待确认" title="待确认"></button><button class="button icon-only" id="add-block" aria-label="添加区块" title="添加区块"></button></div></div></header>
    <div id="focusbar" hidden></div><div id="board" class="board"></div>
    <section id="welcome" class="welcome" hidden aria-labelledby="welcome-title"><h1 id="welcome-title">从自己的资产开始</h1><div class="welcome-choices"><button class="welcome-choice primary" data-action="import-hub" title="拖入或粘贴 CSV、JSON、截图；无冲突直接写入，⌘Z 整批撤销"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></span> 导入</strong></button><button class="welcome-choice" data-action="manual-import" title="选类别，填名称和管理链接"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span> 手动录入</strong></button><button class="welcome-choice" data-action="inbox" title="粘贴续费通知，核对后再记录"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg></span> 待确认</strong></button><button class="welcome-choice native-only" data-action="github-import" title="只读仓库元数据"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1.5-4-2-7-2m14 5v-3.9a3.4 3.4 0 0 0-1-2.6c3.2-.3 6.5-1.5 6.5-7A5.2 5.2 0 0 0 19 4.6 4.8 4.8 0 0 0 18.9 1S17.7.7 15 2.5a10.4 10.4 0 0 0-6 0C6.3.7 5.1 1 5.1 1A4.8 4.8 0 0 0 5 4.6 5.2 5.2 0 0 0 3.5 8.5c0 5.4 3.3 6.7 6.5 7a3.4 3.4 0 0 0-1 2.6V22"/></svg></span> GitHub</strong></button><button class="welcome-choice native-only" data-action="cloudflare-import" title="只读 Zone、Pages、Workers、R2"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5h12a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.8A3.5 3.5 0 0 0 3.5 15.5Z"/><path d="M15.5 15.5h5a2.5 2.5 0 0 0 0-5 3.5 3.5 0 0 0-3.3-2.4"/></svg></span> Cloudflare</strong></button><button class="welcome-choice native-only" data-action="gmail-import" title="只搜账单、续费和服务通知"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg></span> Gmail</strong></button></div></section>
    <div id="empty" class="empty" hidden><span>⌕</span><h2 id="empty-title">没有结果</h2><p id="empty-note" hidden></p><button class="button" id="clear-search">清除</button></div>
  </main>
  <aside id="detail" class="detail" hidden aria-label="资产详情"><button class="close" id="close-detail" aria-label="关闭详情">×</button><div id="detail-content"></div></aside>
  <dialog id="modal"><div class="modal-head"><div><h2 id="modal-title"></h2></div><button class="close" id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="keys-help" class="keys-help" role="dialog" aria-modal="true" aria-labelledby="keys-help-title" hidden></div>
  <link rel="stylesheet" href="material.css">
  <script src="theme.js"></script>
  <script src="asset-data.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body></html>
