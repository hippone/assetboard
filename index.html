<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Assetboard · 我的数字资产</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2335644e'/%3E%3Ctext x='10' y='29' fill='white' font-size='30' font-family='-apple-system,Helvetica,sans-serif'%3Ea%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <div class="toolbar"><div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索资产" aria-label="搜索资产"><kbd>⌘ K</kbd></label><button class="button" id="inbox-button" data-action="inbox">待确认</button><button class="button primary" id="add-block">＋ 添加区块</button></div></div>
    <div id="agenda" class="agenda" hidden aria-label="接下来的到期与扣款"></div><div id="focusbar" hidden></div><div id="board" class="board"></div>
    <section id="welcome" class="welcome" hidden aria-labelledby="welcome-title"><h1 id="welcome-title">从自己的资产开始</h1><p>手动录入一项，或连接平台读取授权范围内的资产。这里不会放入演示记录。</p><div class="welcome-choices"><button class="welcome-choice" data-action="manual-import"><strong>＋ 手动录入</strong><span>选择类别，填写名称、图标和管理链接</span></button><button class="welcome-choice" data-action="inbox"><strong>✎ 粘贴续费通知</strong><span>从账单或提醒文字识别日期和费用，确认后再记录</span></button><button class="welcome-choice native-only" data-action="github-import"><strong>⌘ 导入 GitHub 仓库</strong><span>只读取授权范围内的仓库元数据</span></button><button class="welcome-choice native-only" data-action="cloudflare-import"><strong>◎ 导入 Cloudflare Zone</strong><span>只读取令牌范围内的 Zone</span></button><button class="welcome-choice native-only" data-action="gmail-import"><strong>✉ 导入 Gmail 通知</strong><span>只搜索账单、续费与服务通知</span></button><button class="welcome-choice native-only" data-action="ocr-import"><strong>▤ 识别截图或 PDF</strong><span>选取本机文件，在此 Mac 识别文字</span></button></div><p class="welcome-note native-only">推荐使用限定权限的令牌；导入前会先验证读取权限。</p></section>
    <div id="empty" class="empty" hidden><span>⌕</span><h2 id="empty-title">没有找到这项资产</h2><p id="empty-note">试试名称、平台或用途，收起区块中的资产也会被搜索。</p><button class="button" id="clear-search">清除搜索</button></div>
  </main>
  <aside id="detail" class="detail" hidden aria-label="资产详情"><button class="close" id="close-detail" aria-label="关闭详情">×</button><div id="detail-content"></div></aside>
  <dialog id="modal"><div class="modal-head"><div><h2 id="modal-title"></h2></div><button class="close" id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="keys-help" class="keys-help" role="dialog" aria-modal="true" aria-labelledby="keys-help-title" hidden></div>
  <link rel="stylesheet" href="material.css">
  <script src="theme.js"></script>
  <script src="asset-data.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body></html>
