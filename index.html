<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Assetboard · 我的数字资产</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2335644e'/%3E%3Ctext x='10' y='29' fill='white' font-size='30' font-family='-apple-system,Helvetica,sans-serif'%3Ea%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <div class="toolbar"><div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索资产" aria-label="搜索资产"><kbd>⌘ K</kbd></label><button class="button" id="import-button" data-action="import-hub">导入</button><button class="button" id="inbox-button" data-action="inbox">待确认</button><button class="button primary" id="add-block">＋ 添加区块</button></div></div>
    <div id="agenda" class="agenda" hidden aria-label="接下来的到期与扣款"></div><div id="focusbar" hidden></div><div id="board" class="board"></div>
    <section id="welcome" class="welcome" hidden aria-labelledby="welcome-title"><h1 id="welcome-title">从自己的资产开始</h1><p>拖入文件、粘贴表格，或打开导入面板。无冲突时直接写入，可用 ⌘Z 整批撤销。</p><div class="welcome-choices"><button class="welcome-choice" data-action="import-hub"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></span> 导入</strong><span>拖入 CSV / JSON / 截图，或连接平台</span></button><button class="welcome-choice" data-action="manual-import"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span> 手动录入</strong><span>选择类别，填写名称和管理链接</span></button><button class="welcome-choice" data-action="inbox"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg></span> 待确认资料</strong><span>粘贴续费通知，核对后再记录</span></button><button class="welcome-choice native-only" data-action="github-import"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1.5-4-2-7-2m14 5v-3.9a3.4 3.4 0 0 0-1-2.6c3.2-.3 6.5-1.5 6.5-7A5.2 5.2 0 0 0 19 4.6 4.8 4.8 0 0 0 18.9 1S17.7.7 15 2.5a10.4 10.4 0 0 0-6 0C6.3.7 5.1 1 5.1 1A4.8 4.8 0 0 0 5 4.6 5.2 5.2 0 0 0 3.5 8.5c0 5.4 3.3 6.7 6.5 7a3.4 3.4 0 0 0-1 2.6V22"/></svg></span> GitHub 仓库</strong><span>只读取授权范围内的仓库元数据</span></button><button class="welcome-choice native-only" data-action="cloudflare-import"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5h12a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.8A3.5 3.5 0 0 0 3.5 15.5Z"/><path d="M15.5 15.5h5a2.5 2.5 0 0 0 0-5 3.5 3.5 0 0 0-3.3-2.4"/></svg></span> Cloudflare 资源</strong><span>读取 Zone、Pages、Workers 与 R2</span></button><button class="welcome-choice native-only" data-action="gmail-import"><strong><span class="tile sm type-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg></span> Gmail 通知</strong><span>只搜索账单、续费与服务通知</span></button></div><p class="welcome-note">也可直接把 CSV、JSON 备份或截图拖到板上；演示模式可用虚构样本试导入，不会保存。</p></section>
    <div id="empty" class="empty" hidden><span>⌕</span><h2 id="empty-title">没有找到这项资产</h2><p id="empty-note">试试名称、平台或用途，收起区块中的资产也会被搜索。</p><button class="button" id="clear-search">清除搜索</button></div>
  </main>
  <aside id="detail" class="detail" hidden aria-label="资产详情"><button class="close" id="close-detail" aria-label="关闭详情">×</button><div id="detail-content"></div></aside>
  <dialog id="modal"><div class="modal-head"><div><h2 id="modal-title"></h2></div><button class="close" id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="keys-help" class="keys-help" role="dialog" aria-modal="true" aria-labelledby="keys-help-title" hidden></div>
  <link rel="stylesheet" href="material.css">
  <script src="theme.js"></script>
  <script src="asset-data.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body></html>
