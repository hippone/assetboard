<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assetboard · 我的数字资产</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2335644e'/%3E%3Ctext x='10' y='29' fill='white' font-size='30' font-family='Georgia'%3Ea%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <div class="toolbar"><div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索资产" aria-label="搜索资产"><kbd>⌘ K</kbd></label><button class="button" id="edit">⌘ <span>调整布局</span></button><button class="button primary" id="add-block">＋ 添加区块</button></div></div>
    <div class="editbar" id="editbar" hidden><span><b>正在调整布局</b> · 拖动标题手柄移动，拖动右下角缩放</span><div><button id="undo" class="text-button">撤销</button><span id="save-status">保存在此浏览器</span></div></div>
    <div id="focusbar" hidden></div><div id="board" class="board"></div>
    <div id="empty" class="empty" hidden><span>⌕</span><h2>没有找到这项资产</h2><p>试试名称、平台或用途，收起区块中的资产也会被搜索。</p><button class="button" id="clear-search">清除搜索</button></div>
  </main>
  <aside id="detail" class="detail" hidden aria-label="资产详情"><button class="close" id="close-detail" aria-label="关闭详情">×</button><div id="detail-content"></div></aside>
  <dialog id="modal"><div class="modal-head"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="modal-title"></h2></div><button class="close" id="close-modal" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <link rel="stylesheet" href="material.css">
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body></html>
